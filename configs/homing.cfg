#####################################################################
#	Probe
#####################################################################


[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_EA76A2085157355957202020FF121025-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 15 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed
contact_max_hotend_temperature: 180 # increase to probe at print temps
contact_sensitivity: 1 # default 0; raised to give autocal more room on noisy taps
autocal_max_retries: 5 # default 3; more attempts to converge before giving up
home_xy_position: 150,150
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

##	Gantry Corners for 300mm Build
gantry_corners:
	-60,-10
	360,370
#	Probe points
points:
	50,25
	50,225
	250,225
	250,25

speed: 300
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075
max_adjust: 30
