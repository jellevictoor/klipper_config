#####################################################################
# 	Print start/end and related macro's
#####################################################################

[gcode_macro PRINT_START]
##  Z offset added after heating to print temp, to compensate for hotend
##  thermal expansion between the 150C contact-probing temp and print temp.
##  Calibrate with a real coefficient (mm per degree C) instead of guessing;
##  see https://github.com/YanceyA/BeaconPrinterTools thermal expansion tool.
##  Leave at 0 until calibrated - no behavior change from today's baseline.
variable_thermal_expansion_z_per_degree: 0.0
variable_thermal_expansion_probe_temp: 150
gcode:
    # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0

    G28     ; home axes
    G0 Z2   ; position beacon at 2mm for heat soak
    
    STATUS_HEATING
    SET_FAN_SPEED FAN=filter SPEED=0.6
    M140 S{target_bed}     ; start bed heater
    M109 S150       ; preheat nozzle to probing temp
    M190 S{target_bed}     ; wait on bed temperature
    G4 P60000       ; optional, let temps settle for 1 min

    CLEAN_NOZZLE     ; call another macro to wipe nozzle if available
    
    SET_DISPLAY_TEXT MSG="Beacon calibrate contact"      # Displays info

    G28 Z METHOD=CONTACT CALIBRATE=1    ; calibrate z offset and beacon model hot

    SET_DISPLAY_TEXT MSG="QGL"      # Displays info
    STATUS_LEVELING                 # Sets SB-leds to leveling-mode
    quad_gantry_level
    
    SET_DISPLAY_TEXT MSG="Bed mesh"    # Displays info
    STATUS_MESHING
    BED_MESH_CALIBRATE RUNS=2           ; bed mesh in scan mode

    CLEAN_NOZZLE
    SET_DISPLAY_TEXT MSG="Beacon calibrate contact"      # Displays info

    G28 Z METHOD=CONTACT CALIBRATE=0    ; calibrate z offset only after tilt/mesh
    
    SET_DISPLAY_TEXT MSG="Heating nozzle"      # Displays info

    M104 S{target_extruder}                    ; set extruder to print temp
    M109 S{target_extruder      }                    ; wait for extruder temp

    {% set expansion = (target_extruder - thermal_expansion_probe_temp) * thermal_expansion_z_per_degree %}
    SET_GCODE_OFFSET Z={expansion}    ; compensate for hotend thermal expansion above probe temp

    SET_DISPLAY_TEXT MSG="Printer goes brr"          # Displays info

    STATUS_PRINTING
    SET_VELOCITY_LIMIT ACCEL=500 ACCEL_TO_DECEL=250    ; slow down for purge + first layers, restored by _AFTER_LAYER_CHANGE
    LINE_PURGE    ; call another macro to purge or prime nozzle

[gcode_macro _AFTER_LAYER_CHANGE]
##  Restores full velocity/accel after the first couple of layers have
##  bonded. Wire up via layer_change_gcode: _AFTER_LAYER_CHANGE LAYER=[layer_num]
gcode:
    {% set layer = params.LAYER|default(0)|int %}
    {% if layer >= 3 %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F3600                 ; retract filament
    G91                            ; relative positioning
    SET_FAN_SPEED FAN=filter SPEED=0

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    {% set z_park_abs = printer.toolhead.position.z + 25.0 %}
    {% if z_park_abs > max_z %}
        {% set z_park_abs = max_z %}
    {% endif %}

    G0 Z{z_safe} F3600               ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing
    G1 E-20.0 F3600                  ; retract filament another 20mm (completely out of hot zone)

    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=filter SPEED=0

    BED_MESH_CLEAR
    M107                             ; turn off fan
    G90                              ; absolute positioning
    G0 Z{z_park_abs} F3600           ; move nozzle up away from the print
    G0 X{max_x / 2} Y{max_y} F15000  ; park nozzle at rear
    STATUS_READY
    M117 Done


